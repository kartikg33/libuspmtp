name: cppcheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cppcheck:
    name: cppcheck static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cppcheck libprotobuf-dev protobuf-compiler cmake build-essential

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            src/
