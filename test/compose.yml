#
# test/compose.yml
#
# Proves that the libuspmtp C, C++ and Rust examples each build and run
# (independently of one another) against the same OB-USPA USP agent.
#
#   * The C, C++ and Rust services build their own image from this repo with
#     only that language's example — no shared build artifacts between them,
#     so each service is truly independent.
#   * Each example is a standalone app whose build pulls the library in
#     (C/C++ via add_subdirectory, Rust against the installed shared library)
#     and links its single binary (C/C++ statically, Rust dynamically
#     against libuspmtp.so).
#   * obuspa provides a shared UDS MTP socket for the examples to talk to.
#   * obuspa carries a healthcheck on the socket file, and the examples
#     start only once the agent is healthy — so they never fail their
#     first connect against a socket that does not exist yet.  The
#     examples additionally retry their initial GET/subscribe until the
#     agent is ready, as a backstop for any residual startup race.
#
# Usage (from this repo's root):
#   docker compose -f test/compose.yml up --build
#
# Expected output:
#   libuspmtp-c-example   GETs the baseline (LocalAgent, UnixDomainSockets,
#   libuspmtp-cpp-example DeviceInfo) over the UDS MTP socket.
#   libuspmtp-rust-example
#
# The example services reference this repo as their build context, so
# they work even when this compose file is just used as a reference for
# building only one example inside a different repository.
#

services:

  obuspa:
    # Pre-built OCI image that runs the OB-USPA daemon with UDS MTP enabled.
    image: ghcr.io/kartikg33/usp-agent-app:0.0.6
    volumes:
      # Shared Unix Domain Socket directory (UDS MTP)
      - usp_socket:/var/run/obuspa
    environment:
      INTERFACE: eth0
    restart: unless-stopped
    # The daemon needs several seconds to initialise its database and
    # create the UDS socket.  Examples wait for a healthy agent before
    # starting (depends_on below) instead of failing their one-shot
    # connect against a socket that does not exist yet.
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/obuspa/usp.sock"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  libuspmtp-c-example:
    # Builds libuspmtp (static) and the C example, then runs it.
    build:
      context: ..
      dockerfile: examples/c/Dockerfile
    volumes:
      - usp_socket:/var/run/usp
    environment:
      USP_SOCKET_PATH: /var/run/usp/usp.sock
      USP_APP_ENDPOINT_ID: proto::libuspmtp-c-example
      USP_AGENT_ENDPOINT_ID: proto::api-gateway
    depends_on:
      obuspa:
        condition: service_healthy
    restart: unless-stopped

  libuspmtp-cpp-example:
    # Builds libuspmtp (static) and the C++ example, then runs it.
    build:
      context: ..
      dockerfile: examples/cpp/Dockerfile
    volumes:
      - usp_socket:/var/run/usp
    environment:
      USP_SOCKET_PATH: /var/run/usp/usp.sock
      USP_APP_ENDPOINT_ID: proto::libuspmtp-cpp-example
      USP_AGENT_ENDPOINT_ID: proto::api-gateway
    depends_on:
      obuspa:
        condition: service_healthy
    restart: unless-stopped

  libuspmtp-rust-example:
    # Builds libuspmtp (shared) and the Rust example, then runs it.
    # Unlike the C/C++ examples, the Rust binary links libuspmtp.so
    # dynamically.
    build:
      context: ..
      dockerfile: examples/rust/Dockerfile
    volumes:
      - usp_socket:/var/run/usp
    environment:
      USP_SOCKET_PATH: /var/run/usp/usp.sock
      USP_APP_ENDPOINT_ID: proto::libuspmtp-rust-example
      USP_AGENT_ENDPOINT_ID: proto::api-gateway
    depends_on:
      obuspa:
        condition: service_healthy
    restart: unless-stopped

volumes:
  usp_socket:
